<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="PagePatch">
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#pp-bg)"/>

  <!-- bandage / patch, rotated -38° around the centre -->
