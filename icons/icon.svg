    <rect x="31" y="47.5" width="66" height="33" rx="16.5" fill="#FFFFFF"/>
    <rect x="53" y="55.75" width="22" height="16.5" rx="4.5" fill="#2563EB"/>
    <g fill="#2563EB">
      <circle cx="52.8" cy="54.8" r="2.4"/>
      <circle cx="75.2" cy="54.8" r="2.4"/>
      <circle cx="52.8" cy="73.2" r="2.4"/>
      <circle cx="75.2" cy="73.2" r="2.4"/>
    </g>
  </g>
</svg>
